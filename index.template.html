<script>
/* Tab switching. Works for any number of tabs. */
const tabs = Array.from(document.querySelectorAll('.tab'));

function showTab(tab) {
  tabs.forEach(t => {
    const isChosen = t === tab;
    t.setAttribute('aria-selected', isChosen);
    document.getElementById(t.getAttribute('aria-controls')).hidden = !isChosen;
  });
}

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    showTab(tab);
    history.replaceState(null, '', '#' + tab.id.replace('tab-', ''));
  });
});

document.querySelector('.tablist').addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement);
  if (i === -1) return;
  let next;
  if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
  if (e.key === 'ArrowLeft')  next = tabs[(i - 1 + tabs.length) % tabs.length];
  if (next) { next.focus(); showTab(next); e.preventDefault(); }
});

const fromLink = document.getElementById('tab-' + location.hash.slice(1));
if (fromLink) showTab(fromLink);
</script>
